<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<title>X Thread Downloader</title>
		<link rel="stylesheet" href="./popup.css" />
	</head>
	<body>
		<h3>X Thread Downloader</h3>
		<button id="ping" type="button">Check connection</button>
		<label class="check"
			><input id="autoscroll" type="checkbox" /> Auto-expand replies</label
		>
		<label class="row" for="videomode">Video files</label>
		<select id="videomode">
			<option value="bundle">Bundle into ZIP</option>
			<option value="separate" selected>Download separately</option>
			<option value="posters-only">Posters only</option>
		</select>
		<button id="download" type="button">Download JSON</button>
		<button id="cancel" type="button" disabled>Cancel</button>
		<p id="status" role="status" aria-live="polite">
			Opens a thread on X, then download.
		</p>
		<script src="./popup.js" type="module"></script>
	</body>
</html>
