<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<title>X Thread Downloader</title>
		<style>
			body { font-family: system-ui, sans-serif; width: 240px; padding: 12px; }
			#status { margin-top: 8px; color: #555; }
		</style>
	</head>
	<body>
		<h3>X Thread Downloader</h3>
		<button id="ping" type="button">Check connection</button>
		<label><input id="autoscroll" type="checkbox" /> Auto-expand replies</label>
		<button id="download" type="button">Download JSON</button>
		<button id="cancel" type="button" disabled>Cancel</button>
		<p id="status">Opens a thread on X, then download.</p>
		<script src="./popup.js" type="module"></script>
	</body>
</html>
