<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Fixture: new x-web article reader</title>
	</head>
	<body>
		<main>
			<article>
				<figure data-article-part="cover">
					<img
						src="https://pbs.twimg.com/media/ARTICLE_COVER.jpg"
						alt="Article cover"
					/>
				</figure>
				<h1 data-article-part="title" dir="auto">
					The Infinite SaaS Factory
				</h1>
				<div data-article-part="byline">
					<a href="/satyanadella">
						<img
							alt="@satyanadella"
							src="https://pbs.twimg.com/profile_images/1/avatar_normal.jpg"
						/>
					</a>
					<a href="/satyanadella">
						<div class="text-body font-bold text-primary">Satya Nadella</div>
					</a>
					<span class="text-secondary">@satyanadella</span>
				</div>
				<div data-article-part="body">
					<p>
						The opportunity is to reinvent systems of record for an agentic
						world, not just build new experiences on top of them.
					</p>
					<h2>Why it matters</h2>
					<ul>
						<li>Agents need a substrate</li>
					</ul>
					<blockquote>
						Software eats the world; agents eat software.
					</blockquote>
					<p>Read more here.</p>
					<figure>
						<img
							src="https://pbs.twimg.com/media/ARTICLE_BODY.jpg"
							alt=""
						/>
					</figure>
				</div>
			</article>
		</main>
	</body>
</html>
